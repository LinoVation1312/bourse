name: bot

on:
  schedule:
    # Toutes les 30 min, jours ouvrés (heures UTC). Le bot décide lui-même quoi faire selon l'heure de Paris :
    # matin (≈ 8h), alertes en séance, bilan du soir (≈ 22h30). Passe à "*/15" pour des alertes plus rapides
    # (consomme 2 fois plus de minutes GitHub).
    - cron: "*/30 5-22 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode à lancer"
        type: choice
        default: auto
        options: [auto, test, matin, soir, watch, backtest]

permissions:
  contents: write

concurrency:
  group: bourse
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Décider du mode (sans installer quoi que ce soit)
        id: gate
        run: python3 run.py gate
        env:
          MODE: ${{ inputs.mode }}

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.mode != 'skip'
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        if: steps.gate.outputs.mode != 'skip'
        run: pip install -r requirements.txt

      - name: Lancer le bot
        if: steps.gate.outputs.mode != 'skip'
        run: python run.py ${{ steps.gate.outputs.mode }}
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}

      - name: Sauvegarder l'état (positions, backtest)
        if: always() && steps.gate.outputs.mode != 'skip'
        run: |
          git config user.name "bourse-bot"
          git config user.email "bot@users.noreply.github.com"
          for f in state.json stats.json report.md; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet || (git commit -m "état $(date -u +%F-%H%M)" && git pull --rebase -q && git push)
