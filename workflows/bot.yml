name: bot

on:
  schedule:
    # Toutes les 5 min (le minimum de GitHub), jours ouvrés (heures UTC). Le bot décide lui-même quoi faire selon l'heure de Paris :
    # briefing d'ouverture (≈ 15h45), alertes en séance, débriefing de clôture (≈ 22h25), flash des grosses infos de marché.
    # Dépôt public = minutes GitHub Actions gratuites. Le cron de GitHub peut avoir du retard (5 à 20 min) :
    # pour des horaires exacts, déclenche le workflow depuis cron-job.org (voir README).
    - cron: "*/5 5-22 * * 1-5"
  repository_dispatch:
    types: [telegram]          # envoyé par le webhook Telegram (worker/telegram-webhook.js) : réponse en ≈ 30 s
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode à lancer"
        type: choice
        default: auto
        options: [auto, test, ouverture, matin, soir, watch, flash, commands, backtest]

permissions:
  contents: write

concurrency:
  group: bourse
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Décider du mode (sans installer quoi que ce soit)
        id: gate
        run: python3 run.py gate
        env:
          MODE: ${{ inputs.mode || (github.event_name == 'repository_dispatch' && 'commands') || 'auto' }}

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.mode != 'skip'
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        if: steps.gate.outputs.mode != 'skip'
        run: pip install -r requirements.txt

      - name: Lancer le bot
        if: steps.gate.outputs.mode != 'skip'
        run: python run.py ${{ steps.gate.outputs.mode }}
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          TG_UPDATE: ${{ toJSON(github.event.client_payload.update) }}

      - name: Sauvegarder l'état (positions, backtest)
        if: always() && steps.gate.outputs.mode != 'skip'
        run: |
          git config user.name "bourse-bot"
          git config user.email "bot@users.noreply.github.com"
          for f in state.json stats.json report.md; do [ -f "$f" ] && git add "$f"; done
          for i in 1 2 3; do
            git diff --cached --quiet && break
            git commit -q -m "état $(date -u +%F-%H%M)" 2>/dev/null || true
            git pull --rebase -q -X theirs && git push -q && break
            sleep 3
          done
