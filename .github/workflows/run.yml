name: assistant
on:
  schedule:
    - cron: "30 6 * * 1-5"    # matin : résumé + signaux de vente (UTC, ~8h30 Paris l'été)
    - cron: "30 21 * * 1-5"   # soir, après la clôture US : signaux du jour
  workflow_dispatch:           # lancement manuel depuis le navigateur du téléphone

permissions:
  contents: write

concurrency:
  group: assistant
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lancer l'assistant
        run: python bot.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
      - name: Sauvegarder l'état (positions, journal)
        if: always()
        run: |
          git config user.name "assistant-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "état $(date -u +%F-%H%M)" && git pull --rebase -q && git push)
