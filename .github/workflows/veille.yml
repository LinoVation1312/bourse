name: veille
on:
  schedule:
    - cron: "*/30 7-21 * * 1-5"   # toutes les 30 min ; le script ignore les bourses fermées
  workflow_dispatch:               # test manuel : renvoie un état de la veille même sans alerte

permissions:
  contents: write

concurrency:
  group: assistant                 # même groupe que le bot : jamais deux exécutions en même temps
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Veille
        run: python veille.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
      - name: Sauvegarder l'état
        if: always()
        run: |
          git config user.name "assistant-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json veille_state.json
          git diff --cached --quiet || (git commit -m "veille $(date -u +%F-%H%M)" && git pull --rebase -q && git push)
